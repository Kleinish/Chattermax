x-chattermax-volumes: &chattermax-volumes
  - ${INPUT_MOUNT:-./data/input}:/data/input
  - ${CORPUS_SOURCES_MOUNT:-./data/corpus_sources}:/data/corpus_sources
  - ${CORPUS_CACHE_MOUNT:-./data/corpus_cache}:/data/corpus_cache
  - ${DATASET_RAW_MOUNT:-./data/dataset_raw}:/data/dataset_raw
  - ${REJECTED_MOUNT:-./data/rejected}:/data/rejected
  - ${DATASET_MOUNT:-./data/dataset}:/data/dataset
  - ${TRAINING_MOUNT:-./data/training}:/data/training
  - ${OUTPUT_MOUNT:-./data/output}:/data/output
  - ${LOGS_MOUNT:-./data/logs}:/data/logs
  - ${REPORTS_MOUNT:-./data/reports}:/data/reports
  - ${SETTINGS_FILE_MOUNT:-./.env}:/app/.env
  - hf-cache:/root/.cache/huggingface
  - torch-cache:/root/.cache/torch

x-generator-common: &generator-common
  build:
    context: .
    dockerfile: docker/Dockerfile.generator
  image: chattermax-generator
  working_dir: /app
  env_file:
    - .env
  environment:
    WORKSPACE_ROOT: /app
    DATA_ROOT: /data
  volumes: *chattermax-volumes

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  webui:
    <<: [*generator-common, *gpu]
    command: ["uvicorn", "web.app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "${WEBUI_PORT:-8080}:8080"
    volumes:
      - ${DATA_ROOT:-./data}:/data
      - ${INPUT_MOUNT:-./data/input}:/data/input
      - ${CORPUS_SOURCES_MOUNT:-./data/corpus_sources}:/data/corpus_sources
      - ${CORPUS_CACHE_MOUNT:-./data/corpus_cache}:/data/corpus_cache
      - ${DATASET_RAW_MOUNT:-./data/dataset_raw}:/data/dataset_raw
      - ${REJECTED_MOUNT:-./data/rejected}:/data/rejected
      - ${DATASET_MOUNT:-./data/dataset}:/data/dataset
      - ${TRAINING_MOUNT:-./data/training}:/data/training
      - ${OUTPUT_MOUNT:-./data/output}:/data/output
      - ${LOGS_MOUNT:-./data/logs}:/data/logs
      - ${REPORTS_MOUNT:-./data/reports}:/data/reports
      - ${SETTINGS_FILE_MOUNT:-./.env}:/app/.env
      - hf-cache:/root/.cache/huggingface
      - torch-cache:/root/.cache/torch
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WORKSPACE_ROOT: /app
      DATA_ROOT: /data
    shm_size: "2gb"
    restart: unless-stopped

  corpus:
    profiles: ["jobs"]
    <<: *generator-common
    command: ["python3", "scripts/prepare_corpus.py"]

  generator:
    profiles: ["jobs"]
    <<: [*generator-common, *gpu]
    stdin_open: true
    tty: true
    shm_size: "2gb"

  trainer:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: docker/Dockerfile.trainer
    image: chattermax-trainer
    working_dir: /app
    env_file:
      - .env
    environment:
      WORKSPACE_ROOT: /app
      DATA_ROOT: /data
    volumes: *chattermax-volumes
    stdin_open: true
    tty: true
    shm_size: "4gb"
    <<: *gpu

  speech-isolator:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: docker/Dockerfile.speech-isolator
    image: chattermax-speech-isolator
    expose:
      - "7860"
    environment:
      DATA_ROOT: /data
      XDG_CACHE_HOME: /data/cache
      DEFAULT_STRENGTH: medium
    volumes:
      - ${INPUT_MOUNT:-./data/input}:/data/output
      - ${SPEECH_CACHE_MOUNT:-./data/speech-isolator/cache}:/data/cache

volumes:
  hf-cache:
  torch-cache:
